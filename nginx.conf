server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # fotos dos produtos: precisa aceitar upload maior que o padrao (1 MB)
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API e documentacao ficam no container do backend
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ ^/(swagger-ui|v3/api-docs|actuator)/ {
        proxy_pass       http://api:8080;
        proxy_set_header Host $host;
    }

    # arquivos com hash no nome podem ser cacheados por muito tempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
